<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="368 aanvallen op dieren geregistreerd in Nederland in het eerste kwartaal van 2025. Bron: meldpunt BIJ12.">
  <rect width="1200" height="675" fill="#1361FF"/>

  <text x="80" y="118" fill="#FFFFFF" font-family="Roobert, Arial, sans-serif" font-weight="700" font-size="42">Aanvallen op dieren</text>
  <text x="80" y="166" fill="#FFFFFF" font-family="Roobert, Arial, sans-serif" font-weight="400" font-size="26" opacity="0.82">Nederland, eerste kwartaal 2025</text>

  <line x1="80" y1="212" x2="1120" y2="212" stroke="#FFFFFF" stroke-width="1" opacity="0.28"/>

  <text x="80" y="440" fill="#FFAF16" font-family="Roobert, Arial, sans-serif" font-weight="700" font-size="220" letter-spacing="-6">368</text>
  <text x="80" y="500" fill="#FFFFFF" font-family="Roobert, Arial, sans-serif" font-weight="500" font-size="30">geregistreerde aanvallen</text>

  <g transform="translate(700 268)">
    <rect width="420" height="232" rx="14" fill="#FFFFFF" opacity="0.12"/>
    <text x="34" y="60" fill="#FFFFFF" font-family="Roobert, Arial, sans-serif" font-weight="600" font-size="24">Overijssel</text>
    <text x="34" y="104" fill="#FFFFFF" font-family="Roobert, Arial, sans-serif" font-weight="400" font-size="21" opacity="0.85">sloeg de wolf minder vaak toe</text>
    <text x="34" y="136" fill="#FFFFFF" font-family="Roobert, Arial, sans-serif" font-weight="400" font-size="21" opacity="0.85">dan in andere provincies in</text>
    <text x="34" y="168" fill="#FFFFFF" font-family="Roobert, Arial, sans-serif" font-weight="400" font-size="21" opacity="0.85">het oosten van het land.</text>
  </g>

  <line x1="80" y1="560" x2="1120" y2="560" stroke="#FFFFFF" stroke-width="1" opacity="0.28"/>
  <text x="80" y="606" fill="#FFFFFF" font-family="Roobert, Arial, sans-serif" font-weight="400" font-size="20" opacity="0.75">Bron: meldpunt BIJ12, analyse ANP</text>

  <g transform="translate(1006 578)">
    <rect x="0" y="-32" width="114" height="46" rx="10" fill="#FFFFFF"/>
    <text x="57" y="0" fill="#1361FF" font-family="Roobert, Arial, sans-serif" font-weight="600" font-size="27" text-anchor="middle">oost</text>
  </g>
</svg>
